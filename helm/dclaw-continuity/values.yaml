replicaCount: 1

frontend:
  image:
    repository: dclaw-continuity-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3052
  ingress:
    enabled: false

backend:
  image:
    repository: dclaw-continuity-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8138
  env:
    CONTINUITY_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/dclaw_continuity"

database:
  name: dclaw_continuity
