# Default values = DEV / local cluster. Reproduces the live dclaw-core deployment.
# Plain `helm install dclaw-continuity ./helm -n dclaw-core` brings the app up.
# For the cloud/GHCR deployment, override with: -f values-prod.yaml
#
# Note: the live app runs with minio/redis disabled (REDIS_URL / S3_ENDPOINT_URL
# empty). The original chart could provision those operators; see values-prod.yaml.

nameOverride: ""

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: docker.io/library/dclaw-continuity-backend
    tag: local
    pullPolicy: Never
  containerPort: 8150
  service:
    type: ClusterIP
    port: 8150
  env: {}
  livenessProbe:
    path: /health/
    initialDelaySeconds: 15
    periodSeconds: 30
  readinessProbe:
    path: /health/
    initialDelaySeconds: 10
    periodSeconds: 10
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: docker.io/library/dclaw-continuity-frontend
    tag: local
    pullPolicy: Never
  containerPort: 3064
  service:
    type: NodePort
    port: 3064
    nodePort: 30052
  env:
    PORT: "3064"
    BACKEND_URL: http://dclaw-continuity-backend:8150
  readinessProbe:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

secret:
  name: ""
  data:
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@dclaw-shared-postgres:5432/dclaw_continuity
    APP_ENV: production
    AUTH_DEV_MODE: "true"
    SECRET_KEY: dclaw-continuity-local-secret-key-32-bytes-min!
    REDIS_URL: ""
    S3_ENDPOINT_URL: ""

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: ""
  tls: []
