{{- if .Values.monitoring.prometheus.enabled }}
{{- /*
Minimal single-instance Prometheus for in-cluster scraping.
For production at scale, use kube-prometheus-stack and set
.Values.monitoring.prometheus.enabled=false here.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dclaw-app.fullname" . }}-prometheus-config
  labels:
    app.kubernetes.io/name: {{ include "dclaw-app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: dclaw-continuity-backend
        metrics_path: /metrics
        static_configs:
          - targets:
              - {{ include "dclaw-app.fullname" . }}-backend:{{ .Values.service.backend.port }}
            labels:
              app: dclaw-continuity
              component: backend
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dclaw-app.fullname" . }}-prometheus
  labels:
    app.kubernetes.io/name: {{ include "dclaw-app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.monitoring.prometheus.storage.size | quote }}
  {{- with .Values.monitoring.prometheus.storage.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dclaw-app.fullname" . }}-prometheus
  labels:
    app.kubernetes.io/name: {{ include "dclaw-app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dclaw-app.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: monitoring
      app.kubernetes.io/part-of: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dclaw-app.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: prometheus
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheus.image | quote }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.monitoring.prometheus.retention }}
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
              name: http
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
          {{- with .Values.monitoring.prometheus.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: {{ include "dclaw-app.fullname" . }}-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "dclaw-app.fullname" . }}-prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dclaw-app.fullname" . }}-prometheus
  labels:
    app.kubernetes.io/name: {{ include "dclaw-app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "dclaw-app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: prometheus
{{- end }}
