{{- if .Values.redis.enabled }}
{{- /*
Minimal in-cluster Redis for caching (embedding cache, future rate-limits).
For anything beyond a single dev/staging replica, swap this for a managed
Redis (ElastiCache, Memorystore) or the bitnami/redis chart and just set
.Values.redis.enabled=false here.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dclaw-app.fullname" . }}-redis
  labels:
    app.kubernetes.io/name: {{ include "dclaw-app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cache
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.redis.storage.size | quote }}
  {{- with .Values.redis.storage.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dclaw-app.fullname" . }}-redis
  labels:
    app.kubernetes.io/name: {{ include "dclaw-app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dclaw-app.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dclaw-app.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          args:
            - "--save"
            - "60"
            - "1000"
            - "--appendonly"
            - "no"
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- with .Values.redis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "dclaw-app.fullname" . }}-redis
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dclaw-app.fullname" . }}-redis
  labels:
    app.kubernetes.io/name: {{ include "dclaw-app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: {{ include "dclaw-app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cache
{{- end }}
