{{- /*
Application secrets. When CNPG is enabled, the DATABASE_URL is provided by
the CNPG-managed Secret `<fullname>-pg-app` (which CNPG creates automatically
with keys `uri`, `username`, `password`, etc.). In that case the app
Deployment should `envFrom:` that secret directly instead of using the static
URL below.

This Secret carries the rest of the runtime config (LLM keys, auth, etc.).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dclaw-app.fullname" . }}-secrets
type: Opaque
stringData:
  {{- if not .Values.cnpg.enabled }}
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/dclaw_continuity"
  {{- end }}
  APP_ENV: "production"
  AUTH_DEV_MODE: "false"
  SECRET_KEY: "change-me-in-production"
  OLLAMA_BASE_URL: "http://ollama:11434"
  OLLAMA_MODEL: "llama3.1"
  OLLAMA_EMBED_MODEL: "nomic-embed-text"
  OPENROUTER_API_KEY: ""
  OPENROUTER_MODEL: "moonshotai/kimi-k2"
