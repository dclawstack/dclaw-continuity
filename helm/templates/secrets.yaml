{{- /*
Application secrets.

If `.Values.auth.existingSecret` is set we trust that secret is already
populated out-of-band (sealed-secrets, external-secrets, --set, …) and
skip rendering this Secret entirely. The backend Deployment can envFrom:
the user-provided Secret directly.

Otherwise we render an in-chart Secret from the `.Values.auth.*` block.
The defaults are dev-only and emit a NOTES.txt warning if left as-is.

CNPG note: DATABASE_URL is provided by the CNPG-managed
`<fullname>-pg-app` Secret when cnpg.enabled, so it's omitted here.
*/}}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dclaw-app.fullname" . }}-secrets
type: Opaque
stringData:
  {{- if not .Values.cnpg.enabled }}
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/dclaw_continuity"
  {{- end }}
  APP_ENV: "production"
  AUTH_DEV_MODE: {{ .Values.auth.authDevMode | quote }}
  SECRET_KEY: {{ .Values.auth.secretKey | quote }}
  OLLAMA_BASE_URL: {{ .Values.auth.ollamaBaseUrl | quote }}
  OLLAMA_MODEL: {{ .Values.auth.ollamaModel | quote }}
  OLLAMA_EMBED_MODEL: {{ .Values.auth.ollamaEmbedModel | quote }}
  OPENROUTER_API_KEY: {{ .Values.auth.openrouterApiKey | quote }}
  OPENROUTER_MODEL: {{ .Values.auth.openrouterModel | quote }}
  {{- if .Values.redis.enabled }}
  REDIS_URL: "redis://{{ include "dclaw-app.fullname" . }}-redis:6379/0"
  {{- end }}
  {{- if .Values.minio.enabled }}
  S3_ENDPOINT_URL: "http://{{ include "dclaw-app.fullname" . }}-minio:9000"
  S3_ACCESS_KEY_ID: {{ .Values.minio.rootUser | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.minio.rootPassword | quote }}
  S3_BUCKET: {{ .Values.minio.bucket | quote }}
  S3_FORCE_PATH_STYLE: "true"
  {{- end }}
{{- end }}
